services:
  - type: web
    name: financial-document-backend
    runtime: image
    image:
      url: ghcr.io/palprityush-ops/financial-document-backend:latest
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false

  - type: web
    name: financial-document-frontend
    runtime: image
    image:
      url: ghcr.io/palprityush-ops/financial-document-frontend:latest
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: API_BASE
        value: https://financial-document-backend.onrender.com
      - key: API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
