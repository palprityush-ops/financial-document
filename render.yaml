services:
  - type: web
    name: financial-document-backend
    runtime: image
    image:
      url: ghcr.io/palprityush-ops/financial-document-backend:latest
      creds:
        fromRegistryCreds:
          name: ghcr-read
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false

  - type: web
    name: financial-document-frontend
    runtime: image
    image:
      url: ghcr.io/palprityush-ops/financial-document-frontend:latest
      creds:
        fromRegistryCreds:
          name: ghcr-read
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: API_BASE
        sync: false
      - key: API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_SECRET_KEY
        sync: false
