{% extends "layout.html" %}
{% block title %}{{ code }} — {{ title }}{% endblock %}

{% block content %}
<div style="min-height: 60vh; display: flex; align-items: center; justify-content: center;">
  <div style="text-align: center; max-width: 480px;" class="fade-up fade-up-1">

    <!-- Error Code -->
    <div style="
      font-family: var(--font-mono);
      font-size: 6rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 16px;
      {% if code == 404 %}color: var(--accent);
      {% elif code == 500 %}color: var(--high);
      {% else %}color: var(--medium);{% endif %}
    ">{{ code }}</div>

    <!-- Title -->
    <h2 style="
      font-family: var(--font-mono);
      font-size: 1.2rem;
      color: var(--text);
      margin-bottom: 12px;
      letter-spacing: 1px;
    ">// {{ title | upper }}</h2>

    <!-- Message -->
    <p style="color: var(--muted); font-size: 0.88rem; margin-bottom: 32px; line-height: 1.6;">
      {{ message }}
    </p>

    <!-- Actions -->
    <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
      <a href="/" class="btn-ev" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
        <i class="bi bi-speedometer2"></i> Go to Dashboard
      </a>
      <a href="javascript:history.back()" class="btn-ev-outline" style="display: inline-flex; align-items: center; gap: 8px;">
        <i class="bi bi-arrow-left"></i> Go Back
      </a>
    </div>

    <!-- Divider -->
    <div style="margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border);">
      <p style="font-size: 0.75rem; color: var(--muted); font-family: var(--font-mono);">
        EVIDENTIA · GLA University · 2026
      </p>
    </div>

  </div>
</div>
{% endblock %}
