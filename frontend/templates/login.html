{% extends "layout.html" %}
{% block title %}Sign In — Evidentia{% endblock %}

{% block content %}
<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center;">
  <div style="width: 100%; max-width: 420px;">

    <div class="page-header fade-up fade-up-1" style="text-align: center; margin-bottom: 32px;">
      <h1>// EVIDENTIA</h1>
      <p>Financial Document Intelligence System</p>
    </div>

    <div class="card fade-up fade-up-2">
      <div class="card-header-custom" style="display: flex; align-items: center; gap: 8px;">
        <i class="bi bi-lock"></i> SECURE LOGIN
      </div>
      <div class="p-4">

        {% if error %}
        <div class="ev-alert error">
          <i class="bi bi-exclamation-triangle"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">

          <div style="margin-bottom: 18px;">
            <label class="ev-label">Username</label>
            <input
              type="text"
              name="username"
              required
              autocomplete="username"
              placeholder="Enter your username"
              class="ev-input"
            />
          </div>

          <div style="margin-bottom: 28px;">
            <label class="ev-label">Password</label>
            <input
              type="password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="Enter your password"
              class="ev-input"
            />
          </div>

          <button type="submit" class="btn-ev" style="width: 100%; justify-content: center; font-size: 0.9rem; padding: 12px; display: flex; align-items: center; gap: 8px;">
            <i class="bi bi-box-arrow-in-right"></i> Sign In
          </button>

        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 0.83rem; color: var(--muted);">
          Don't have an account?
          <a href="/signup" style="color: var(--accent); text-decoration: none; margin-left: 4px;">Create one</a>
        </div>

      </div>
    </div>

  </div>
</div>
{% endblock %}
