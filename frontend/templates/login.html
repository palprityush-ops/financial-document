{% extends "layout.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center;">
  <div style="width: 100%; max-width: 420px;">

    <!-- Header -->
    <div class="page-header fade-up fade-up-1" style="text-align: center; margin-bottom: 32px;">
      <h1>// EVIDENTIA</h1>
      <p>Financial Document Intelligence System</p>
    </div>

    <!-- Card -->
    <div class="card fade-up fade-up-2">
      <div class="card-header-custom" style="display: flex; align-items: center; gap: 8px;">
        <i class="bi bi-lock"></i> SECURE LOGIN
      </div>
      <div class="p-4">

        <!-- Error Message -->
        {% if error %}
        <div style="
          background: rgba(224,82,82,0.1);
          border: 1px solid var(--high);
          border-radius: 6px;
          padding: 10px 14px;
          margin-bottom: 20px;
          color: var(--high);
          font-size: 0.85rem;
          display: flex;
          align-items: center;
          gap: 8px;
        ">
          <i class="bi bi-exclamation-triangle"></i> {{ error }}
        </div>
        {% endif %}

        <!-- Form -->
        <form method="POST" action="/login">

          <div style="margin-bottom: 18px;">
            <label style="display: block; font-size: 0.78rem; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px;">
              Username
            </label>
            <input
              type="text"
              name="username"
              required
              autocomplete="username"
              style="
                width: 100%;
                background: var(--surface2);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 10px 14px;
                color: var(--text);
                font-family: 'DM Sans', sans-serif;
                font-size: 0.9rem;
                outline: none;
                box-sizing: border-box;
                transition: border-color 0.2s;
              "
              onfocus="this.style.borderColor='var(--accent)'"
              onblur="this.style.borderColor='var(--border)'"
            />
          </div>

          <div style="margin-bottom: 28px;">
            <label style="display: block; font-size: 0.78rem; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px;">
              Password
            </label>
            <input
              type="password"
              name="password"
              required
              autocomplete="current-password"
              style="
                width: 100%;
                background: var(--surface2);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 10px 14px;
                color: var(--text);
                font-family: 'DM Sans', sans-serif;
                font-size: 0.9rem;
                outline: none;
                box-sizing: border-box;
                transition: border-color 0.2s;
              "
              onfocus="this.style.borderColor='var(--accent)'"
              onblur="this.style.borderColor='var(--border)'"
            />
          </div>

          <button type="submit" class="btn-ev" style="width: 100%; justify-content: center; font-size: 0.9rem; padding: 12px;">
            <i class="bi bi-box-arrow-in-right"></i> Login
          </button>

        </form>

        <!-- Signup Link -->
        <div style="text-align: center; margin-top: 20px; font-size: 0.83rem; color: var(--muted);">
          Account nahi hai?
          <a href="/signup" style="color: var(--accent); text-decoration: none; margin-left: 4px;">
            Sign Up karo
          </a>
        </div>

      </div>
    </div>

  </div>
</div>
{% endblock %}
