{% extends "layout.html" %}

{% block content %}

<h2 class="mb-4">Risk Overview</h2>

<div class="row">

<div class="col-md-3">
<div class="card text-white bg-primary mb-3">
<div class="card-body">
<h5>Total Invoices</h5>
<h3>{{ total }}</h3>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card text-white bg-danger mb-3">
<div class="card-body">
<h5>High Risk</h5>
<h3>{{ high }}</h3>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card text-white bg-warning mb-3">
<div class="card-body">
<h5>Medium Risk</h5>
<h3>{{ medium }}</h3>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card text-white bg-success mb-3">
<div class="card-body">
<h5>Low Risk</h5>
<h3>{{ low }}</h3>
</div>
</div>
</div>

</div>

{% endblock %}
