name: Publish Render Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/financial-document-backend:latest
            ghcr.io/${{ github.repository_owner }}/financial-document-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/financial-document-frontend:latest
            ghcr.io/${{ github.repository_owner }}/financial-document-frontend:${{ github.sha }}

      - name: Trigger Render backend deploy (optional)
        env:
          RENDER_DEPLOY_HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_BACKEND" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_BACKEND"
          else
            echo "RENDER_DEPLOY_HOOK_BACKEND is not set; skipping backend deploy trigger."
          fi

      - name: Trigger Render frontend deploy (optional)
        env:
          RENDER_DEPLOY_HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_FRONTEND" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_FRONTEND"
          else
            echo "RENDER_DEPLOY_HOOK_FRONTEND is not set; skipping frontend deploy trigger."
          fi
